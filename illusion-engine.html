<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Illusion Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050510; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', () => { resize(); });

// ── Color palette ──────────────────────────────────────────────────────
const C = {
  HIGH_ACTIVATED: { core: [255, 200, 55],  glow: [255, 150, 0]   },  // gold
  LOW_ACTIVATED:  { core: [0,   220, 160], glow: [0,   200, 120] },  // teal
  HIGH_DIM:       { core: [240, 95,  35],  glow: [210, 55,  10]  },  // ember
  LOW_DIM:        { core: [130, 130, 160], glow: [90,  90,  130] },  // ash
};

const particles  = [];
const ghostTrails = [];
let lastSpawnT = -9999;
const SPAWN_MS  = 1050;
const MAX_P     = 75;

// ── Particle factory ───────────────────────────────────────────────────
function mkParticle() {
  const roll = Math.random();
  let type;
  if      (roll < 0.29) type = 'HIGH_ACTIVATED';
  else if (roll < 0.57) type = 'LOW_ACTIVATED';
  else if (roll < 0.84) type = 'HIGH_DIM';
  else                  type = 'LOW_DIM';

  const isHigh = type.startsWith('HIGH');
  const isAct  = type.endsWith('ACTIVATED');

  const p = {
    type,
    x: -35,
    y: H * (0.12 + Math.random() * 0.76),
    vx: 1.5 + Math.random() * 0.8,
    vy: (Math.random() - 0.5) * 0.6,
    r:  isHigh ? 17 + Math.random() * 13 : 6 + Math.random() * 7,
    activation: isAct ? 0.68 + Math.random() * 0.32 : 0.07 + Math.random() * 0.2,
    alpha: 0,          // fade in
    fadeIn: true,
    age: 0,
    trailT: 0,
    trail: [],         // live trail
    pulseOff: Math.random() * Math.PI * 2,
    pulseRate: isAct ? 1.9 + Math.random() * 2.0 : 0.4 + Math.random() * 0.5,
    settled: false,
    settleWobble: 0,
  };

  if (type === 'HIGH_ACTIVATED') {
    p.tx = cx + cx * (0.22 + Math.random() * 0.58);
    p.ty = cy * (0.13 + Math.random() * 0.68);
  } else if (type === 'LOW_ACTIVATED') {
    p.tx = cx * (0.12 + Math.random() * 0.88);
    p.ty = cy * (0.1  + Math.random() * 0.78);
  } else if (type === 'HIGH_DIM') {
    // Initially aims at top-right — the illusion
    p.tx = cx + cx * (0.15 + Math.random() * 0.5);
    p.ty = cy * (0.18 + Math.random() * 0.52);
    p.illusionState    = 'rising';
    p.illusionDuration = 2600 + Math.random() * 2400;
    p.fallTx = cx + cx * (0.15 + Math.random() * 0.65);
    p.fallTy = H  * (0.72 + Math.random() * 0.22);
  } else {
    p.tx = cx * (0.08 + Math.random() * 0.72);
    p.ty = H  * (0.68 + Math.random() * 0.28);
  }

  return p;
}

// ── Update ─────────────────────────────────────────────────────────────
function update(p, dt) {
  p.age += dt;
  const ft = dt / 16.667; // 1.0 at 60 fps

  // Fade in
  if (p.fadeIn) {
    p.alpha = Math.min(1, p.alpha + 0.04 * ft);
    if (p.alpha >= 1) p.fadeIn = false;
  }

  // Trail sample
  p.trailT += dt;
  if (p.trailT > 85) {
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 30) p.trail.shift();
    p.trailT = 0;
  }

  if (p.type === 'HIGH_DIM') {
    if (p.illusionState === 'rising') {
      steer(p, p.tx, p.ty, 0.00055, ft);
      if (p.age > p.illusionDuration) p.illusionState = 'fading';
    } else {
      // Fade out while falling toward Q3
      steer(p, p.fallTx, p.fallTy, 0.00045, ft);
      p.vy += 0.018 * ft;  // gravity
      p.activation -= 0.00042 * dt;
      p.alpha      -= 0.00032 * dt;
      p.pulseRate  *= Math.pow(0.9998, dt); // heartbeat slows
      if (p.activation < 0) p.activation = 0;
      if (p.alpha < 0.04) {
        if (p.trail.length > 5) {
          ghostTrails.push({
            pts: p.trail.map(t => ({ ...t })),
            r: p.r,
            a: 0.60,
            decay: 0.00014 + Math.random() * 0.00008,
          });
        }
        return false;
      }
    }
  } else if (p.type === 'LOW_DIM') {
    steer(p, p.tx, p.ty, 0.00035, ft);
    p.alpha -= 0.00020 * dt;
    if (p.alpha < 0.04) return false;
  } else {
    if (!p.settled) {
      const dx = p.tx - p.x, dy = p.ty - p.y;
      if (dx * dx + dy * dy < 900) {
        p.settled = true;
        p.vx *= 0.3; p.vy *= 0.3;
      } else {
        steer(p, p.tx, p.ty, 0.00065, ft);
      }
    } else {
      p.settleWobble += dt;
      p.vx += (Math.random() - 0.5) * 0.018 * ft;
      p.vy += (Math.random() - 0.5) * 0.018 * ft;
      p.vx *= Math.pow(0.955, ft);
      p.vy *= Math.pow(0.955, ft);
    }
  }

  p.vx *= Math.pow(0.990, ft);
  p.vy *= Math.pow(0.990, ft);
  p.x  += p.vx * ft;
  p.y  += p.vy * ft;

  return !(p.x > W + 90 || p.x < -90 || p.y > H + 90 || p.y < -90);
}

function steer(p, tx, ty, k, ft) {
  p.vx += (tx - p.x) * k * ft;
  p.vy += (ty - p.y) * k * ft;
}

// ── Draw particle ──────────────────────────────────────────────────────
function drawParticle(p, t) {
  const { core: [cr, cg, cb], glow: [gr, gg, gb] } = C[p.type];
  const pulse   = Math.sin(t * p.pulseRate * 0.001 + p.pulseOff);
  const glowAmt = p.activation * (0.22 + pulse * 0.08);
  const glowR   = p.r * (2.5 + pulse * p.activation * 1.4);

  ctx.save();
  ctx.globalAlpha = p.alpha;

  // Glow halo
  const g1 = ctx.createRadialGradient(p.x, p.y, p.r * 0.4, p.x, p.y, glowR);
  g1.addColorStop(0, `rgba(${gr},${gg},${gb},${glowAmt.toFixed(3)})`);
  g1.addColorStop(1, `rgba(${gr},${gg},${gb},0)`);
  ctx.fillStyle = g1;
  ctx.beginPath();
  ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
  ctx.fill();

  // Core sphere
  const g2 = ctx.createRadialGradient(
    p.x - p.r * 0.32, p.y - p.r * 0.32, p.r * 0.08,
    p.x, p.y, p.r
  );
  g2.addColorStop(0, `rgba(${Math.min(255,cr+60)},${Math.min(255,cg+60)},${Math.min(255,cb+60)},1)`);
  g2.addColorStop(0.55, `rgba(${cr},${cg},${cb},1)`);
  g2.addColorStop(1,   `rgba(${Math.max(0,cr-50)},${Math.max(0,cg-50)},${Math.max(0,cb-50)},0.8)`);
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fill();

  // Specular highlight
  if (p.activation > 0.1) {
    ctx.globalAlpha = p.alpha * p.activation * 0.35;
    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.beginPath();
    ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ── Draw live trail (HIGH_DIM only, while rising) ──────────────────────
function drawLiveTrail(p) {
  const trail = p.trail;
  if (trail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++) {
    const frac = i / trail.length;
    ctx.globalAlpha = frac * 0.18 * p.alpha;
    ctx.strokeStyle = `rgb(240,95,35)`;
    ctx.lineWidth   = p.r * 0.28 * frac;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x,     trail[i].y);
    ctx.stroke();
  }
  ctx.restore();
}

// ── Draw ghost trail (persists after particle death) ───────────────────
function drawGhostTrail(g) {
  const { pts } = g;
  if (pts.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) {
    const frac = i / pts.length;
    ctx.globalAlpha = g.a * frac * 0.65;
    ctx.strokeStyle = `rgb(255,75,25)`;
    ctx.lineWidth   = g.r * 0.32 * frac;
    ctx.beginPath();
    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
    ctx.lineTo(pts[i].x,     pts[i].y);
    ctx.stroke();
  }
  // Faded end-dot marker
  const last = pts[pts.length - 1];
  ctx.globalAlpha = g.a * 0.30;
  ctx.strokeStyle = 'rgba(255,75,25,1)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([2, 5]);
  ctx.beginPath();
  ctx.arc(last.x, last.y, g.r * 0.65, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ── Draw grid ──────────────────────────────────────────────────────────
function drawGrid() {
  ctx.save();

  // Quadrant tints
  const tints = [
    { x: cx,  y: 0,  w: cx, h: cy, c: '255,180,50'  },  // top-right  gold
    { x: 0,   y: 0,  w: cx, h: cy, c: '0,210,150'   },  // top-left   teal
    { x: cx,  y: cy, w: cx, h: cy, c: '255,55,20'    },  // bot-right  red
    { x: 0,   y: cy, w: cx, h: cy, c: '130,130,160'  },  // bot-left   gray
  ];
  ctx.globalAlpha = 0.022;
  for (const t of tints) {
    ctx.fillStyle = `rgb(${t.c})`;
    ctx.fillRect(t.x, t.y, t.w, t.h);
  }

  // Dashed dividers
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 12]);
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

// ── Draw labels ────────────────────────────────────────────────────────
function drawLabels() {
  ctx.save();
  const pad = 20;

  function label(text, sub, x, align, y, mainColor, subAlpha) {
    ctx.textAlign = align;
    ctx.globalAlpha = 0.52;
    ctx.font = 'bold 11px "SF Mono","Fira Code",monospace';
    ctx.fillStyle = mainColor;
    ctx.fillText(text, x, y);
    ctx.globalAlpha = subAlpha;
    ctx.font = '10px "SF Mono","Fira Code",monospace';
    ctx.fillText(sub, x, y + 16);
  }

  // Top-right
  label('HIGH VALUE × ACTIVATED',    'compounding engine',                W - pad, 'right', pad + 4,    '#FFB830', 0.28);
  // Top-left
  label('LOW VALUE × ACTIVATED',     'upgrade potential',                 pad,     'left',  pad + 4,    '#00D0A0', 0.28);
  // Bottom-right
  label('HIGH VALUE × NOT ACTIVATED','the illusion — where budget goes to die', W - pad, 'right', H - pad - 14, '#FF5028', 0.38);
  // Bottom-left
  label("LOW VALUE × NOT ACTIVATED", "they're gone",                      pad,     'left',  H - pad - 14, '#8888A0', 0.22);

  // Axis hints at center crosshairs
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = '9px "SF Mono","Fira Code",monospace';
  ctx.fillText('← LOW    FIRST CONVERSION VALUE    HIGH →', cx, cy + 13);
  ctx.save();
  ctx.translate(13, cy);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('← LOW    ACTIVATION    HIGH →', 0, 0);
  ctx.restore();

  // Title
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px "SF Mono","Fira Code",monospace';
  ctx.fillText('THE ILLUSION ENGINE', cx, 17);

  ctx.restore();
}

// ── Main loop ──────────────────────────────────────────────────────────
let lastT = 0;

function frame(t) {
  const dt = Math.min(t - lastT, 50);
  lastT = t;

  if (t - lastSpawnT > SPAWN_MS && particles.length < MAX_P) {
    particles.push(mkParticle());
    lastSpawnT = t;
  }

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawLabels();

  // Ghost trails
  for (let i = ghostTrails.length - 1; i >= 0; i--) {
    ghostTrails[i].a -= ghostTrails[i].decay * dt;
    if (ghostTrails[i].a <= 0) ghostTrails.splice(i, 1);
    else drawGhostTrail(ghostTrails[i]);
  }

  // Live trails (HIGH_DIM in flight)
  for (const p of particles) {
    if (p.type === 'HIGH_DIM') drawLiveTrail(p);
  }

  // Update + draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    if (!update(particles[i], dt)) particles.splice(i, 1);
    else drawParticle(particles[i], t);
  }

  requestAnimationFrame(frame);
}

// ── Pre-populate to avoid empty start ─────────────────────────────────
for (let i = 0; i < 14; i++) {
  const p = mkParticle();
  p.x = W * (0.04 + Math.random() * 0.88);
  p.y = H * (0.06 + Math.random() * 0.88);
  p.alpha = 0.6 + Math.random() * 0.4;
  p.fadeIn = false;
  p.age = Math.random() * 4000;
  if ((p.type === 'HIGH_ACTIVATED' || p.type === 'LOW_ACTIVATED') && Math.random() > 0.45) {
    p.settled = true;
    p.x = p.tx + (Math.random() - 0.5) * 60;
    p.y = p.ty + (Math.random() - 0.5) * 60;
    p.vx = 0; p.vy = 0;
  }
  if (p.type === 'HIGH_DIM' && Math.random() > 0.5) {
    // Pre-place some in their illusion arc
    p.illusionState = 'rising';
    p.age = p.illusionDuration * (0.3 + Math.random() * 0.5);
  }
  particles.push(p);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
